# CUSTOM: builds YOUR version of Navidrome for the Raspberry Pi 5
# and stores it on GitHub as: ghcr.io/<your-username>/navidrome:latest
#
# It runs:
#   - automatically every time you change code on the "master" branch
#   - or by hand: Actions tab -> "Build my Navidrome image" -> "Run workflow"

name: Build my Navidrome image

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write # lets this job save the image to your GitHub account

jobs:
  build:
    # An ARM computer, same chip family as the Pi, so no translating needed
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up the Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub's image storage
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and upload the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=custom
